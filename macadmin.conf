# Apache: /etc/httpd/conf.d/macadmin.conf
Alias /macadmin /var/www/macadmin

<Directory /var/www/macadmin>
    DirectoryIndex index.php
    Options -Indexes
    AllowOverride None
    # pristup jen ze skolni site (upravte podle potreby)
    Require ip 192.168.0.0/24
</Directory>

# konfigurace, SQL a skript udrzby nejsou pro web
<FilesMatch "^(config(\.sample)?\.php|lib\.php|udrzba\.php|setup\.sql|README\.md)$">
    Require all denied
</FilesMatch>
