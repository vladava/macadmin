# Apache: /etc/httpd/conf.d/macadmin.conf
Alias /macadmin /var/www/macadmin

<Directory /var/www/macadmin>
    DirectoryIndex index.php
    Options -Indexes
    AllowOverride None
    # pristup jen ze skolni site (upravte podle potreby)
    Require ip 192.168.0.0/24

    # heslo spravce jen pres HTTPS
    <If "%{HTTPS} != 'on'">
        Redirect permanent "https://%{HTTP_HOST}%{REQUEST_URI}"
    </If>

    # konfigurace, SQL a skript udrzby nejsou pro web (jen v tomto adresari)
    <FilesMatch "^(config(\.sample)?\.php|lib\.php|udrzba\.php|import-forms\.php)$|\.(sql|md|log)$">
        Require all denied
    </FilesMatch>
</Directory>
